version: '3.8'

services:
  dashboard:
    build: .
    container_name: safehdf-dashboard
    ports:
      - "3001:80"
    restart: unless-stopped
    environment:
      - REACT_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - REACT_APP_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REACT_APP_GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - safehdf-network

networks:
  safehdf-network:
    driver: bridge